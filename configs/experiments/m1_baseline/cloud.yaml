# M1 vanilla vLLM baseline, cloud scale (template).
experiment: m1_baseline
hardware: configs/hardware/cloud.yaml
policy: lru
seed: 0
workload:
  kind: synthetic
  topology: selector
  num_agents: 6
  num_sessions: 1000
  max_turns: 13
  max_tokens: 256
  arrival: {process: poisson, rate_sessions_per_s: [0.2, 1, 5, 20, 50]}   # paper Fig. 11 range
kv_budget_blocks: [100, 150, 200]
metrics: [hit_rate, ttft, per_turn_latency, throughput]
