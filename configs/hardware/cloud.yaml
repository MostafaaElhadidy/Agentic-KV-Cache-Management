# Cloud hardware profile (Phase 2, M6). Not yet run; see docs/CLOUD_RUNBOOK.md.
name: cloud-a100-80gb
model_file: ../models/llama31_8b.yaml   # Llama-3.1-8B-Instruct; one-line mirror/meta-llama switch there
vllm:
  gpu_memory_utilization: 0.90
  max_model_len: 4096            # workload max request ~44 blocks (704 tokens); experiments may lower it
  max_num_seqs: 256
  block_size: 16
  enable_prefix_caching: true
  enforce_eager: false
  num_gpu_blocks_override: null
  tensor_parallel_size: 1
env:
  HF_HUB_OFFLINE: "0"
