# Standard synthetic trace set (M2). Tuning traces (seed 101+) are separate from evaluation traces.
out_dir: results/traces
token_id_range: [1000, 150000]   # Qwen2.5 regular tokens (special tokens >= 151643)
# Workload profile calibrated with VANILLA only on the tuning seed (scripts/calibrate_workload.py,
# results/calibration/workload_calibration.json): scale 0.4 of the base profile.
profile:
  name: selector-calibrated-0.4
  anchor_tokens: {P: 224, A: 179, C: 211, T: 160, R: 173, D: 141}
  task_tokens: [19, 38]
  header_tokens: 4
  output_tokens:
    P: [6, 16]
    A: [6, 13]
    C: [10, 22]
    T: [6, 13]
    R: [6, 16]
    D: [6, 16]
  tool_tokens:
    P: [0, 0]
    A: [10, 29]
    C: [0, 13]
    T: [6, 22]
    R: [0, 0]
    D: [0, 0]
  calls_per_invocation:
    P: [1, 1]
    A: [1, 3]
    C: [1, 3]
    T: [1, 2]
    R: [1, 1]
    D: [1, 1]
  turns: [6, 12]
  max_prompt_tokens: 1400
  think_s: [0.2, 0.5]
  tool_s: [0.05, 0.25]
  start_agent: P

traces:
  # evaluation traces
  - {name: selector_eval, topology: selector, num_sessions: 60, arrival_rate: 0.5, seed: 1}
  - {name: pipeline_eval, topology: pipeline, num_sessions: 60, arrival_rate: 0.5, seed: 1}
  - {name: debate_eval, topology: debate, num_sessions: 60, arrival_rate: 0.5, seed: 1}
  - {name: random_eval, topology: random, num_sessions: 60, arrival_rate: 0.5, seed: 1}
  - {name: selector_eval_s2, topology: selector, num_sessions: 60, arrival_rate: 0.5, seed: 2}
  - {name: selector_eval_s3, topology: selector, num_sessions: 60, arrival_rate: 0.5, seed: 3}
  # tuning traces (never used for reported results)
  - {name: selector_tune, topology: selector, num_sessions: 60, arrival_rate: 0.5, seed: 101, role: tune}
  - {name: debate_tune, topology: debate, num_sessions: 60, arrival_rate: 0.5, seed: 102, role: tune}
  # tiny trace for smoke tests of the GPU runner
  - {name: smoke, topology: selector, num_sessions: 4, arrival_rate: 2.0, seed: 999, role: smoke}
  - {name: tiny, topology: selector, num_sessions: 1, arrival_rate: 1.0, seed: 998, role: smoke}
