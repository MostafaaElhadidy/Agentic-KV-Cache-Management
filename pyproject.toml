# Tool configuration only (no packaging yet).
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: needs the CUDA GPU (no model loading)",
]

[tool.ruff.lint.per-file-ignores]
"scripts/aggregate_report.py" = ["E501"]   # long Markdown table f-strings
"scripts/aggregate_real.py" = ["E501"]     # long Markdown table f-strings
"src/cachescout/agents/definitions.py" = ["E501"]   # agent prompt text
